<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#08090E" />
  <circle cx="32" cy="32" r="24" stroke="url(#grad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="#00F2FE" stroke-width="1.5" transform="rotate(-30 32 32)" opacity="0.8" />
  <!-- Center Core -->
  <circle cx="32" cy="32" r="6" fill="url(#grad)" filter="url(#glow)" />
  <circle cx="20" cy="24" r="2.5" fill="#00F2FE" />
  <circle cx="44" cy="40" r="2.5" fill="#9D4EDD" />
  <path d="M28 26 L36 32 L28 38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>